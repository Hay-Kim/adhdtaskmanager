<!DOCTYPE html>
<html lang="ko">
<head>

        <p>고객님의 쿠팡 나중결제 미납 금액이 정상적으로 처리되었습니다.</p>
        <div class="details">

            <p><strong>입금 일자:</strong> 2025년 2월 7일</p>
            <p><strong>주문 번호:</strong> CP-20250207-001</p>

    </div>
</body>
</html>
